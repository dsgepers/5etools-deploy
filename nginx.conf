server {
    listen 80;
    server_name _;

    root /data/5etools-src;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
